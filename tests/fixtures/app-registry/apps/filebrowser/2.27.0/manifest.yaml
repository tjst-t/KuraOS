apiVersion: v1
name: filebrowser
version: "2.27.0"
type: legacy
display_name:
  ja: "File Browser"
  en: "File Browser"
description:
  ja: "ブラウザから KuraOS の共有ストレージを操作するファイルマネージャ。"
  en: "Browser-based file manager for KuraOS shared storage."
homepage: https://filebrowser.org

containers:
  web:
    image: filebrowser/filebrowser:v2.27.0
    # filebrowser's FB_BASEURL env var is unreliable across docker
    # image versions; --baseurl CLI flag is the documented contract.
    command:
      - --address
      - "0.0.0.0"
      - --port
      - "80"
      - --root
      - "/srv"
      - --database
      - "/database/filebrowser.db"
      - --baseurl
      - "/apps/filebrowser"
    ports:
      - "80:80"

shares:
  - name: target_share
    access: readwrite
    mountpoint: /srv
    container: web

storage:
  datasets:
    - name: db
      pool_hint: ssd
      backup: true
      quota: 100M

routing:
  mode: path
  base_path_env: FB_BASEURL
  container: web
  port: 80

health:
  endpoint: /health
  container: web
  interval: 10s

setup:
  required:
    - key: target_share
      type: share_picker
      label:
        ja: "管理する共有"
        en: "Share to manage"
  optional: []

settings: []

backup:
  datasets:
    - db

auth:
  mode: none
