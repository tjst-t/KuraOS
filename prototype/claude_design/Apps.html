<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Apps — KuraOS</title>
<link rel="stylesheet" href="shared/shared.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  .app-icon {
    width: 44px; height: 44px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--surface-2), var(--bg));
    border: 1px solid var(--border);
    display: grid; place-items: center;
    color: var(--text-2);
    font-weight: 600;
    font-size: 16px;
    flex: none;
  }
  .app-card {
    display: flex; flex-direction: column; gap: 10px;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: border-color .15s, transform .15s;
  }
  .app-card:hover { border-color: var(--border-strong); transform: translateY(-1px); }
  .modal-backdrop.show { animation: fadein .15s ease; }
  @keyframes fadein { from { opacity: 0 } to { opacity: 1 } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="shared/shared.jsx"></script>
<script type="text/babel">
const { useState } = React;

const INSTALLED = [
  { name: 'immich',     ver: 'v1.112.0', status: 'running', cpu: 3.2,  mem: 412, type: 'photo',   cat: 'Media',   desc: 'Self-hosted photo & video management' },
  { name: 'jellyfin',   ver: 'v10.9.7',  status: 'running', cpu: 12.4, mem: 892, type: 'video',   cat: 'Media',   desc: 'メディアサーバー' },
  { name: 'nextcloud',  ver: 'v29.0.4',  status: 'running', cpu: 1.1,  mem: 318, type: 'cloud',   cat: 'Productivity', desc: 'ファイル共有・コラボレーション' },
  { name: 'paperless',  ver: 'v2.10.2',  status: 'running', cpu: 0.4,  mem: 124, type: 'docs',    cat: 'Productivity', desc: '書類管理' },
  { name: 'syncthing',  ver: 'v1.27.7',  status: 'error',   cpu: 0.0,  mem: 0,   type: 'sync',    cat: 'Sync',    desc: 'P2P 同期' },
  { name: 'gitea',      ver: 'v1.22.0',  status: 'running', cpu: 0.6,  mem: 218, type: 'git',     cat: 'Dev',     desc: 'Git ホスティング' },
  { name: 'home-assist',ver: 'v2024.4',  status: 'running', cpu: 2.1,  mem: 412, type: 'iot',     cat: 'IoT',     desc: 'ホームオートメーション' },
  { name: 'monitoring', ver: 'v1.0.0',   status: 'running', cpu: 1.4,  mem: 248, type: 'mon',     cat: 'System',  desc: 'Grafana + Prometheus' },
  { name: 'tailscale',  ver: 'v1.66.4',  status: 'running', cpu: 0.1,  mem: 32,  type: 'net',     cat: 'System',  desc: 'メッシュ VPN' },
  { name: 'pihole',     ver: 'v5.18',    status: 'running', cpu: 0.2,  mem: 64,  type: 'dns',     cat: 'Network', desc: 'DNS 広告ブロック' },
  { name: 'vaultwarden',ver: 'v1.30.5',  status: 'running', cpu: 0.1,  mem: 48,  type: 'pass',    cat: 'Security',desc: 'パスワードマネージャ' },
  { name: 'audiobookshelf', ver: 'v2.10', status: 'stopped', cpu: 0,   mem: 0,   type: 'audio',   cat: 'Media',   desc: 'オーディオブックサーバー' },
];

const STORE = [
  { name: 'plex',         cat: 'Media',        desc: 'メディアサーバー (Premium)' },
  { name: 'sonarr',       cat: 'Media',        desc: 'TV 番組管理' },
  { name: 'radarr',       cat: 'Media',        desc: '映画管理' },
  { name: 'minio',        cat: 'Storage',      desc: 'S3 互換オブジェクトストレージ' },
  { name: 'photoprism',   cat: 'Media',        desc: 'AI ベース写真管理' },
  { name: 'bookstack',    cat: 'Productivity', desc: 'ドキュメント Wiki' },
  { name: 'mealie',       cat: 'Productivity', desc: 'レシピマネージャ' },
  { name: 'wallabag',     cat: 'Productivity', desc: '後で読むサービス' },
  { name: 'ntfy',         cat: 'Network',      desc: 'プッシュ通知サーバー' },
  { name: 'duplicati',    cat: 'Backup',       desc: 'クラウドバックアップ' },
  { name: 'firefly-iii',  cat: 'Finance',      desc: '個人会計' },
  { name: 'navidrome',    cat: 'Media',        desc: '音楽ストリーミング' },
];

function StatusBadge({ s }) {
  const cls = s === 'running' ? 'ok' : s === 'error' ? 'crit' : '';
  return <span className={"badge " + cls}><span className="badge-dot" />{s}</span>;
}

function App() {
  const { t } = useLang();
  const [view, setView] = useState('installed');
  const [cat, setCat] = useState('All');
  const [installing, setInstalling] = useState(null);

  const cats = ['All', ...Array.from(new Set([...STORE, ...INSTALLED].map(a => a.cat)))];
  const visible = view === 'installed' ? INSTALLED : STORE;
  const filtered = cat === 'All' ? visible : visible.filter(a => a.cat === cat);

  return (
    <Shell
      active="apps"
      crumbs={['KuraOS', t('nav_apps')]}
      headerActions={
        <div className="search">
          <Icon name="search" size={14} />
          <input placeholder="アプリを検索" />
        </div>
      }
    >
      <div className="page-head">
        <div>
          <h1 className="page-title">{t('nav_apps')}</h1>
          <p className="page-sub">{INSTALLED.length} installed · {STORE.length}+ available · 公式レジストリ</p>
        </div>
        <div className="row gap-sm">
          <button className="btn"><Icon name="upload" size={14} />マニフェストから</button>
          <button className="btn btn-primary" onClick={() => setView('store')}><Icon name="plus" size={14} />アプリを追加</button>
        </div>
      </div>

      <div className="tabs">
        <button className="tab" data-active={view === 'installed'} onClick={() => setView('installed')}>
          {t('apps_installed')} <span className="muted mono">({INSTALLED.length})</span>
        </button>
        <button className="tab" data-active={view === 'store'} onClick={() => setView('store')}>
          {t('apps_store')} <span className="muted mono">({STORE.length}+)</span>
        </button>
      </div>

      <div className="row gap-sm" style={{marginBottom: 16, flexWrap: 'wrap'}}>
        {cats.map(c => (
          <button key={c} className="btn btn-sm" style={{background: c === cat ? 'var(--surface-2)' : '', borderColor: c === cat ? 'var(--border-strong)' : ''}} onClick={() => setCat(c)}>{c}</button>
        ))}
      </div>

      {view === 'installed' && (
        <div className="grid" style={{gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))'}}>
          {filtered.map(a => (
            <div key={a.name} className="app-card">
              <div className="row center" style={{gap: 12}}>
                <div className="app-icon">{a.name.slice(0,1).toUpperCase()}</div>
                <div style={{flex: 1, minWidth: 0}}>
                  <div className="row center between">
                    <div style={{fontWeight: 600, fontSize: 14}}>{a.name}</div>
                    <StatusBadge s={a.status} />
                  </div>
                  <div className="mono" style={{fontSize: 11, color: 'var(--text-3)'}}>{a.ver} · {a.cat}</div>
                </div>
              </div>
              <p className="muted" style={{fontSize: 12, margin: 0, lineHeight: 1.5}}>{a.desc}</p>
              <div className="row between" style={{paddingTop: 8, borderTop: '1px solid var(--border)', fontSize: 11, color: 'var(--text-3)'}}>
                <span className="mono">CPU {a.cpu}%</span>
                <span className="mono">MEM {a.mem} MB</span>
                <button className="btn btn-ghost btn-sm" style={{padding: '2px 6px'}}><Icon name="chevron_right" size={12} /></button>
              </div>
            </div>
          ))}
        </div>
      )}

      {view === 'store' && (
        <div className="grid" style={{gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))'}}>
          {filtered.map(a => (
            <div key={a.name} className="app-card" onClick={() => setInstalling(a)}>
              <div className="row center" style={{gap: 12}}>
                <div className="app-icon">{a.name.slice(0,1).toUpperCase()}</div>
                <div style={{flex: 1, minWidth: 0}}>
                  <div style={{fontWeight: 600, fontSize: 14}}>{a.name}</div>
                  <div className="mono" style={{fontSize: 11, color: 'var(--text-3)'}}>{a.cat}</div>
                </div>
              </div>
              <p className="muted" style={{fontSize: 12, margin: 0, lineHeight: 1.5}}>{a.desc}</p>
              <button className="btn btn-sm" style={{alignSelf: 'flex-start'}}><Icon name="download" size={12} />インストール</button>
            </div>
          ))}
        </div>
      )}

      {installing && (
        <div className="modal-backdrop show" onClick={(e) => { if (e.target === e.currentTarget) setInstalling(null); }}>
          <div className="modal">
            <div className="card-head">
              <div className="row center" style={{gap: 12}}>
                <div className="app-icon">{installing.name.slice(0,1).toUpperCase()}</div>
                <div>
                  <h3 className="card-title">{installing.name} をインストール</h3>
                  <p className="card-sub">{installing.cat} · {installing.desc}</p>
                </div>
              </div>
              <button className="btn btn-icon btn-ghost" onClick={() => setInstalling(null)}><Icon name="x" size={16} /></button>
            </div>
            <div className="card-body col">
              <div className="banner">
                <Icon name="info" size={16} className="banner-icon" />
                <div>
                  ストレージ・ポート・パスワードは自動設定されます。
                  必須項目だけ確認してください。
                </div>
              </div>

              <div className="field">
                <label>写真の保存先</label>
                <select className="select">
                  <option>📁 photos (tank/photos · 4.1 TB used)</option>
                  <option>📁 新規作成: tank/photos</option>
                </select>
              </div>

              <div className="field">
                <label>公開先 (グループ)</label>
                <div className="row wrap" style={{gap: 6}}>
                  <span className="badge"><span className="badge-dot" />family</span>
                  <span className="badge muted">+ 追加</span>
                </div>
              </div>

              <details>
                <summary className="muted" style={{fontSize: 12, cursor: 'pointer', padding: '6px 0'}}>詳細設定 (オプション)</summary>
                <div className="col gap-sm" style={{marginTop: 12}}>
                  <div className="field"><label>upload_limit</label><input className="input mono" defaultValue="10G" /></div>
                  <div className="field"><label>ルーティング</label>
                    <select className="select" defaultValue="path">
                      <option value="path">path: /apps/{installing.name}</option>
                      <option value="port">port</option>
                      <option value="sub">subdomain</option>
                    </select>
                  </div>
                </div>
              </details>

              <div className="banner ok">
                <Icon name="check" size={16} className="banner-icon" />
                <div>
                  <span className="mono">tank/apps/{installing.name}/db</span> · 5G を SSD プール (fast) に配置<br/>
                  <span className="mono">tank/apps/{installing.name}/cache</span> · 20G
                </div>
              </div>
            </div>
            <div className="card-foot">
              <span className="muted">推定セットアップ時間: 2 分</span>
              <div className="row gap-sm">
                <button className="btn" onClick={() => setInstalling(null)}>キャンセル</button>
                <button className="btn btn-accent">インストール</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </Shell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
