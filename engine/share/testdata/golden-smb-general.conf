# Generated by KuraOS — do not edit by hand. Regenerated on every config apply.
# Source of truth: SQLite shares table + config.json. Manual edits will be lost.

[global]
   workgroup = WORKGROUP
   server string = KuraOS
   server role = standalone server
   server min protocol = SMB2
   client min protocol = SMB2
   server signing = auto
   server multi channel support = yes
   use sendfile = yes
   aio read size = 1
   aio write size = 1
   socket options = TCP_NODELAY IPTOS_LOWDELAY
   smb encrypt = desired
   ea support = yes
   inherit acls = yes
   inherit permissions = yes
   map archive = no
   map hidden = no
   map system = no
   store dos attributes = yes
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log level = 1
   log file = /var/log/samba/log.%m
   max log size = 1000

[photos]
   path = /tank/photos
   comment = KuraOS share photos
   browseable = yes
   read only = no
   guest ok = no
   valid users = @family, alice
   write list = alice
   read list = @family
   create mask = 0664
   directory mask = 0775
   vfs objects = catia streams_xattr
   oplocks = yes
   veto files = /.DS_Store/.AppleDouble/.AppleDB/.AppleDesktop/Thumbs.db/
   case sensitive = auto

