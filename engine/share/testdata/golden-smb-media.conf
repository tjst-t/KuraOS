# Generated by KuraOS — do not edit by hand. Regenerated on every config apply.
# Source of truth: SQLite shares table + config.json. Manual edits will be lost.

[global]
   workgroup = WORKGROUP
   server string = KuraOS
   server role = standalone server
   server min protocol = SMB2
   client min protocol = SMB2
   server signing = auto
   server multi channel support = yes
   use sendfile = yes
   aio read size = 1
   aio write size = 1
   socket options = TCP_NODELAY IPTOS_LOWDELAY
   smb encrypt = desired
   # KuraOS users live in the credential vault, not in /etc/shadow — PAM
   # account_check would reject them. Disable so vault-managed users can
   # authenticate at the SMB layer (Ssys001).
   obey pam restrictions = no
   # Reject unknown users outright instead of mapping them to the guest
   # account. With the default `Bad User` mapping, a Windows credential
   # cache holding a stale username (e.g. distro `ubuntu`) succeeds at
   # session setup as guest-masquerading-as-ubuntu, then gets ACCESS_DENIED
   # at the share check — Windows interprets that as "auth ok, server
   # refused" and never re-prompts. Setting Never makes auth fail loudly
   # so Windows asks for fresh creds. KuraOS shares are guest_ok = no
   # anyway, so guest mapping has no legitimate use here.
   map to guest = Never
   guest account = nobody
   restrict anonymous = 2
   ea support = yes
   inherit acls = yes
   inherit permissions = yes
   map archive = no
   map hidden = no
   map system = no
   store dos attributes = yes
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log level = 1
   log file = /var/log/samba/log.%m
   max log size = 1000

[media]
   path = /tank/media
   comment = KuraOS share media
   browseable = yes
   read only = no
   guest ok = no
   valid users = @family
   write list = @family
   create mask = 0664
   directory mask = 0775
   vfs objects = catia fruit streams_xattr
   oplocks = yes
   fruit:metadata = stream
   fruit:posix_rename = yes
   veto files = /.DS_Store/.AppleDouble/Thumbs.db/
   case sensitive = auto

